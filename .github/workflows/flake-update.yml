name: Flake update

# manual-only: run from the Actions tab when the pin should be refreshed
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Update flake inputs
        run: nix flake update --commit-lock-file
      - name: Open PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: flake-update
          delete-branch: true
          title: "flake: manual update"
          body: Automated `nix flake update` — lets CI surface nixpkgs breakage before a manual rebuild does.
