name: Flake update

# manual-only: run from the Actions tab when the pin should be refreshed
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Update flake inputs
        run: nix flake update --commit-lock-file
      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: flake-update
          delete-branch: true
          title: flake: manual update
          body: Automated `nix flake update` — lets CI surface nixpkgs breakage before a manual rebuild does.
